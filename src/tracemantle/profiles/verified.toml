# Verified-profile registry, read by `tracemantle --check-profile-freshness`.
# One table per agent. Update an entry by following the checklist in
# docs/profiles.md; no code change is needed.
#
#   version       exact runtime version string or documentation revision checked
#   checked       commit, tag or URL that was inspected
#   verified_on   date of that inspection (TOML date, UTC)
#   docs_url      published documentation page used for the Last-Modified check
#   confirmed     compatibility rule IDs the inspection confirmed
#   contradicted  compatibility rule IDs the inspection contradicted
#
# The entries below carry over the historical-v1 provenance from
# compatibility-v1.json: an unversioned documentation page recorded on
# 2026-04-20, with no runtime build pinned and no rule confirmed or
# contradicted. They are deliberately reported as stale until re-verified.
schema_version = 1

