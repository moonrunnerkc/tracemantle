name: Verify nonpublishing release guard

# Manual negative acceptance only. This workflow has no publication step,
# deployment environment, write permission or release/tag trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Deliberately fail a candidate check
        run: |
          python - <<'PY'
          raise SystemExit('Intentional failed-check fixture; the publishing sentinel must be skipped.')
          PY
  publishing-sentinel:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - run: echo 'ERROR, a failed quality gate reached the nonpublishing sentinel.' && exit 1
  verify:
    if: always()
    needs: [quality, publishing-sentinel]
    runs-on: ubuntu-latest
    steps:
      - name: Verify failed-check prevention
        env:
          QUALITY: ${{ needs.quality.result }}
          SENTINEL: ${{ needs.publishing-sentinel.result }}
        run: test "$QUALITY" = failure && test "$SENTINEL" = skipped
