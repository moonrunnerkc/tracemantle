# Added by the swarm-verify rollout. Verifies each pull request's head in a network-disabled
# container, signs the verdict as a GitHub attestation and posts one comment bound to the head.
# Pinned by full commit; the tag it corresponds to is in the comment beside the pin.
name: swarm-verify
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: moonrunnerkc/swarm-verify@9b7d32a2c01b2c9b0fda6ee8a1584d97008ebc59 # v1.0.7
        with:
          install: true
          image: ghcr.io/astral-sh/uv:python3.12-bookworm
