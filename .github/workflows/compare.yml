name: Trusted bundle comparison
on:
  workflow_dispatch:
    inputs:
      base_revision:
        description: Full trusted base commit SHA
        required: true
      candidate_revision:
        description: Candidate commit SHA to inspect without executing
        required: true
      bundle_path:
        description: Relative bundle directory in both revisions
        required: true
        default: skills/tracemantle
      policy_relative:
        description: Tracked policy path in the trusted base
        required: true
        default: pyproject.toml
      evidence_directory:
        description: Candidate directory containing approved records
        required: true
        default: evidence/records
      approval_run_id:
        description: Protected producer run ID for automation approvals (leave empty for digest-only policies)
        required: false
        default: ""
      approval_run_started_at:
        description: Protected producer run start, timezone-qualified (required with approval_run_id)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.base_revision }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.candidate_revision }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install only the trusted tool
        run: pip install -c trusted/constraints-dev.txt ./trusted
      - name: Compare against immutable trusted policy
        env:
          BASE_REVISION: ${{ inputs.base_revision }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          POLICY_RELATIVE: ${{ inputs.policy_relative }}
          EVIDENCE_DIRECTORY: ${{ inputs.evidence_directory }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          APPROVAL_RUN_STARTED_AT: ${{ inputs.approval_run_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -d "candidate/$EVIDENCE_DIRECTORY" ]; then
            # RECORD.json.approval.json sidecars are read beside their record,
            # never passed as evidence themselves.
            while IFS= read -r -d '' record; do
              args+=(--evidence "$record")
            done < <(find "candidate/$EVIDENCE_DIRECTORY" -maxdepth 1 -type f -name '*.json' ! -name '*.approval.json' -print0)
          fi
          # The run context comes from the dispatcher, never from the candidate.
          if [ -n "$APPROVAL_RUN_ID" ] || [ -n "$APPROVAL_RUN_STARTED_AT" ]; then
            if [ -z "$APPROVAL_RUN_ID" ] || [ -z "$APPROVAL_RUN_STARTED_AT" ]; then
              echo "::error::approval_run_id and approval_run_started_at must be supplied together; set both or neither."
              exit 2
            fi
            args+=(--approval-run-id "$APPROVAL_RUN_ID" --approval-run-started-at "$APPROVAL_RUN_STARTED_AT")
          fi
          tracemantle compare "trusted/$BUNDLE_PATH" "candidate/$BUNDLE_PATH" \
            --trusted-root trusted --base-revision "$BASE_REVISION" --policy-relative "$POLICY_RELATIVE" \
            --format github "${args[@]}"
