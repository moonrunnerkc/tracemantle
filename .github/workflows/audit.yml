name: Dependency audit

# Audits the pinned runtime and optional-tokenizer dependency sets against
# published advisories. Runs inside CI, on demand and weekly, because a new
# advisory can apply to an unchanged commit. Ordinary validation stays offline.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Resolution differs by interpreter: 3.10 adds tomli and an older
        # regex, and 3.15 is the newest supported release.
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve the runtime and tokenizer dependencies for this interpreter
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install -c constraints-dev.txt '.[tiktoken]'
          "$RUNNER_TEMP/runtime/bin/python" -m pip freeze --exclude tracemantle > "$RUNNER_TEMP/runtime-requirements.txt"
          cat "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Install the pinned audit tool
        run: python -m pip install -c constraints-dev.txt pip-audit
      - name: Audit (exit 1 is an advisory, exit 2 is an incomplete audit)
        run: python scripts/audit_dependencies.py "$RUNNER_TEMP/runtime-requirements.txt"
