name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"

      - name: Run tests
        # The coverage floor is applied here rather than in pyproject addopts,
        # which would also fail single-file local runs. See the comment there.
        run: python -m pytest tests/ -v --tb=short --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -c constraints-dev.txt -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts

      - run: python scripts/generate_reference.py --check

      - name: SARIF maintainer report
        run: python scripts/sarif_workflow.py --integrated --output "${{ runner.temp }}/sarif-report"

      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-maintainer-report
          path: ${{ runner.temp }}/sarif-report/
          if-no-files-found: error

      - name: Mypy strict
        # Bare mypy uses the [tool.mypy] files list (src plus the checked-in
        # scripts), so the utility scripts are type-gated alongside the package.
        run: mypy

  package:
    needs: [test, lint, tokenizer, approvals]
    # Smoke-check that the project builds and the wheel installs on every push
    # and PR. Attestation and PyPI publishing happen only on tag pushes, in
    # release.yml, so this job stays read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install reproducible build tools
        run: pip install -c constraints-dev.txt build hatchling

      - name: Build exact release artifacts
        run: python -m build --no-isolation --outdir candidate-dist

      - name: Verify wheel and source installs
        run: python scripts/verify_artifacts.py candidate-dist --output artifact-verification.json

      - name: Retain verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracemantle-dist
          path: candidate-dist/*
          if-no-files-found: error

      - name: Retain artifact verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracemantle-verification
          path: artifact-verification.json
          if-no-files-found: error

  tokenizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -c constraints-dev.txt -e ".[dev,tiktoken]"
      - run: python -m pytest tests/ -q --cov-fail-under=80
      - run: python scripts/calibrate_advisories.py --output calibration.json
      - run: pip install -c constraints-dev.txt strictyaml click
      - run: python scripts/verify_reference_corpus.py --output conformance.json

  approvals:
    # Ubuntu 22.04 permits bubblewrap without changing host namespace protections.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openssh-client bubblewrap
      - name: Install pinned upstream minisign (absent from Ubuntu 22.04 repositories)
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --output minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz' | sha256sum --check
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          sudo install -m 0755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - run: pip install -c constraints-dev.txt -e ".[dev]"
      - name: Verify real signatures and isolated approval production
        run: |
          python -m pytest tests/test_signatures.py tests/test_automation_approvals.py --no-cov --junitxml=approvals.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('approvals.xml').getroot()
          assert not root.findall('.//skipped'), 'Required signature and producer checks must not skip'
          PY
      - name: Exercise the Action from this exact source
        uses: ./
        with:
          path: tests/fixtures/onboarding/hello/SKILL.md
          strict: 'true'
