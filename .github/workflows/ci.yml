name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.10 is past upstream end of life and kept as legacy compatibility.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"

      - name: Run tests
        # The coverage floor is applied here rather than in pyproject addopts,
        # which would also fail single-file local runs. See the comment there.
        run: python -m pytest tests/ -v --tb=short --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -c constraints-dev.txt -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests scripts

      - run: python scripts/generate_reference.py --check

      - name: Establish maintenance evidence from this checkout
        run: python scripts/evaluate_scoped_sarif.py seed --project "$GITHUB_WORKSPACE" --output "${{ runner.temp }}/sarif-evidence"

      - name: SARIF maintainer report with optional maintenance reuse
        env:
          SARIF_EVIDENCE: ${{ runner.temp }}/sarif-evidence
          SARIF_REPORT: ${{ runner.temp }}/sarif-report
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['SARIF_EVIDENCE'])
          revision = json.loads((root / 'seed.json').read_text())['trusted_revision']
          subprocess.run([sys.executable, 'scripts/sarif_workflow.py', '--integrated',
                          '--evidence-root', str(root), '--trusted-revision', revision,
                          '--output', os.environ['SARIF_REPORT']], check=True)
          run = json.loads((Path(os.environ['SARIF_REPORT']) / 'run.json').read_text())
          assert set(run['gate']['reuse']) == {'bundle-contract', 'upstream-tests'}
          assert not next(c for c in run['checks'] if c['id'] == 'report')['reused']
          PY

      - name: Verify omitted maintenance checks independently
        run: python scripts/sarif_workflow.py --output "${{ runner.temp }}/sarif-reference"

      - name: Retain SARIF report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-maintainer-report
          path: ${{ runner.temp }}/sarif-report/
          if-no-files-found: error

      - name: Mypy strict
        # Bare mypy uses the [tool.mypy] files list (src plus the checked-in
        # scripts), so the utility scripts are type-gated alongside the package.
        run: mypy

  package:
    needs: [test, lint, tokenizer, approvals]
    # Smoke-check that the project builds and the wheel installs on every push
    # and PR. Attestation and PyPI publishing happen only on tag pushes, in
    # release.yml, so this job stays read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install reproducible build tools
        run: pip install -c constraints-dev.txt build hatchling

      - name: Build exact release artifacts
        run: python -m build --no-isolation --outdir candidate-dist

      - name: Verify wheel and source installs
        run: python scripts/verify_artifacts.py candidate-dist --output artifact-verification.json

      - name: Retain verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracemantle-dist
          path: candidate-dist/*
          if-no-files-found: error

      - name: Retain artifact verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tracemantle-verification
          path: artifact-verification.json
          if-no-files-found: error

  tokenizer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The optional extra on the oldest and newest supported interpreters,
        # plus the 3.12 lane that also runs calibration and conformance.
        python-version: ["3.10", "3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c constraints-dev.txt -e ".[dev,tiktoken]"
      - run: python -m pytest tests/ -q --cov-fail-under=80
      - if: matrix.python-version == '3.12'
        run: python scripts/calibrate_advisories.py --output calibration.json
      - if: matrix.python-version == '3.12'
        run: pip install -c constraints-dev.txt strictyaml click
      - if: matrix.python-version == '3.12'
        run: python scripts/verify_reference_corpus.py --output conformance.json

  artifacts:
    # Clean installs of the exact wheel and source archive built above, on the
    # oldest and newest supported interpreters.
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tracemantle-dist
          path: candidate-dist
      - run: python scripts/verify_artifacts.py candidate-dist

  audit:
    uses: ./.github/workflows/audit.yml

  approvals:
    # Ubuntu 22.04 permits bubblewrap without changing host namespace protections.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openssh-client bubblewrap
      - name: Install pinned upstream minisign (absent from Ubuntu 22.04 repositories)
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --output minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz' | sha256sum --check
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          sudo install -m 0755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - run: pip install -c constraints-dev.txt -e ".[dev]"
      - name: Verify real signatures and isolated approval production
        run: |
          python -m pytest tests/test_signatures.py tests/test_automation_approvals.py --no-cov --junitxml=approvals.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('approvals.xml').getroot()
          assert not root.findall('.//skipped'), 'Required signature and producer checks must not skip'
          PY
      - name: Exercise the Action from this exact source
        uses: ./
        with:
          path: tests/fixtures/onboarding/hello/SKILL.md
          strict: 'true'

  gate:
    # The one check a branch rule needs to require. It always runs and passes
    # only when every job above succeeded, so a failed, cancelled or skipped
    # prerequisite cannot be mistaken for a pass.
    name: CI gate
    if: always()
    needs: [test, lint, tokenizer, approvals, package, artifacts, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job['result'] for name, job in json.loads(os.environ['NEEDS']).items()}
          expected = {'test', 'lint', 'tokenizer', 'approvals', 'package', 'artifacts', 'audit'}
          for name, result in sorted(results.items()):
              print(f'{name}: {result}')
          if set(results) != expected:
              sys.exit(f'Gate prerequisites changed: expected {sorted(expected)}, got {sorted(results)}')
          failed = sorted(name for name, result in results.items() if result != 'success')
          if failed:
              sys.exit(f'Not successful: {", ".join(failed)}')
          PY
